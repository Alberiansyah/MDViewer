<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css" media="not all">
<link rel="stylesheet" href="styles.css">

<script>
  // Apply the saved (or preferred) theme + fonts before the first paint to avoid
  // a flash. The theme ids must mirror the token blocks in styles.css; the
  // colour list here is only used for the pre-paint <meta theme-color> (app.js
  // re-reads the computed value on boot, so drift is self-correcting).
  (function () {
    var MODES = {
      paper: 'light', porcelain: 'light', sepia: 'light', sage: 'light',
      ink: 'dark', midnight: 'dark', slate: 'dark', plum: 'dark'
    };
    var PREPAINT_BG = {
      paper: '#f3efe8', porcelain: '#f2f4f8', sepia: '#f2e7d3', sage: '#edf0e6',
      ink: '#14120f', midnight: '#0d1424', slate: '#15181d', plum: '#1a1326'
    };
    function apply(id) {
      var mode = MODES[id] || 'light';
      var root = document.documentElement;
      root.setAttribute('data-theme', id);
      root.setAttribute('data-mode', mode);
      var l = document.getElementById('hljs-light');
      var d = document.getElementById('hljs-dark');
      if (l) l.media = mode === 'dark' ? 'not all' : 'all';
      if (d) d.media = mode === 'dark' ? 'all' : 'not all';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && PREPAINT_BG[id]) meta.setAttribute('content', PREPAINT_BG[id]);
    }
    try {
      var saved = localStorage.getItem('mdview.theme');
      // Migrate the old 'light'/'dark' values to the matching default theme.
      if (saved === 'light') saved = 'paper';
      else if (saved === 'dark') saved = 'ink';
      if (!saved || !MODES[saved]) {
        saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper';
      }
      apply(saved);
      var stacks = localStorage.getItem('mdview.fontStacks');
      if (stacks) {
        stacks = JSON.parse(stacks);
        ['body', 'ui', 'mono', 'display'].forEach(function (k) {
          if (stacks[k]) document.documentElement.style.setProperty('--font-' + k, stacks[k]);
        });
      }
    } catch (e) { /* ignore */ }
  })();
</script>
</head>

<div class="app" id="app">

      <span class="brand-name">MD<span>View</span></span>
    </div>

    <div class="file-chip" id="fileChip" title="Current document">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3h7.5L18 7.5V21H6z"/><path d="M13.5 3v4.5H18"/>
      </svg>
      <span id="fileName">sample.md</span>
    </div>

    <div class="toolbar-spacer"></div>

    <div class="segmented" id="viewToggle" role="group" aria-label="Which pane to show">
      <button type="button" data-view="editor" class="is-active" aria-pressed="true">Editor</button>
      <button type="button" data-view="preview" aria-pressed="false">Preview</button>
    </div>

    <div class="tool-actions">
      <button class="btn" id="openBtn" type="button" title="Open a Markdown file (Ctrl+O)" aria-label="Open file">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h3.6a2 2 0 0 1 1.4.6L11.4 7H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M12 16.5V11m0 0-2.2 2.2M12 11l2.2 2.2"/>
        </svg>
        <span class="btn-text">Open</span>
      </button>

      <button class="btn" id="exportBtn" type="button" title="Export the preview as HTML (Ctrl+S)" aria-label="Export HTML">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.5v11m0 0 4-4m-4 4-4-4"/><path d="M4 16.5v2.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/>
        </svg>
        <span class="btn-text">Export</span>
      </button>

      <button class="btn btn-icon" id="tocBtn" type="button" title="Toggle outline (Ctrl+\)" aria-label="Toggle outline" aria-expanded="false" aria-controls="toc">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12"/>
          <circle cx="4" cy="6.5" r="1.15" fill="currentColor" stroke="none"/>
          <circle cx="4" cy="12" r="1.15" fill="currentColor" stroke="none"/>
          <circle cx="4" cy="17.5" r="1.15" fill="currentColor" stroke="none"/>
        </svg>
      </button>

      <div class="appearance" id="appearanceWrap">
        <button class="btn btn-icon" id="themeBtn" type="button" title="Appearance — themes &amp; fonts (Ctrl+Shift+L toggles light/dark)" aria-label="Appearance settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="appearancePanel">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-3.6-4-6.8-9-6.8z"/>
            <circle cx="7.6" cy="12.2" r="1.05" fill="currentColor" stroke="none"/>
            <circle cx="10" cy="8.4" r="1.05" fill="currentColor" stroke="none"/>
            <circle cx="14.4" cy="8.4" r="1.05" fill="currentColor" stroke="none"/>
            <circle cx="7.9" cy="15.8" r="1.05" fill="currentColor" stroke="none"/>

        <div class="appearance-panel" id="appearancePanel" role="dialog" aria-modal="false" aria-label="Appearance settings" hidden>

            <div class="ap-section">

<script type="text/plain" id="sample-fallback">
# MDView — a calm place to write Markdown

MDView renders your Markdown as you type. Write on the left, watch it take shape on the right, then export a clean, self-contained HTML file when you're done.

> **Tip** — everything here is editable. Change a line and the preview updates almost immediately.

---

## Getting started

1. Type Markdown in the left pane.
2. Open an existing file with **Open**, or drop a `.md` file anywhere on the page.
3. Export a standalone page with **Export**.

The outline button in the toolbar (or `Ctrl` + `\`) opens a table of contents built from your headings.

### Opening files

You can drag files straight onto the window. Supported extensions are `.md`, `.markdown`, and `.txt`.

### The live preview

Rendering is debounced by about 150 ms, so the preview keeps up while you type without getting in the way.

## Writing guide

### Text formatting

Use **bold**, *italic*, ~~strikethrough~~, and `inline code`. Links look like [this one](https://commonmark.org) and are rendered safely. A single newline stays part of the same paragraph; to start a new line, end a line with two spaces or leave a blank line between paragraphs.

### Lists and tasks

- A simple bullet
- With a nested item
  - and one more level
- Back to the top level

1. Ordered lists work
2. And they keep their numbering
3. Across several lines

- [x] Write something
- [x] Preview it
- [ ] Export it

### Tables

| Feature | Status | Notes |
| :--- | :---: | ---: |
| Live preview | Ready | Debounced |
| Syntax highlighting | Ready | highlight.js |
| Diagrams | Ready | Mermaid |
| Export | Ready | Standalone HTML |

### Code

```js
// Fenced code blocks get a language label and a copy button.
const greeting = (name) => `Hello, ${name}!`;

export function render(items = []) {
  return items
    .filter(Boolean)
    .map(greeting)
    .join("\n");
}
```

```bash
# Shell snippets work too.
npm install --global mdview
mdview ./notes.md --open
```

Inline code sits in a chip, like `const total = price * qty`.

### Diagrams

```mermaid
flowchart LR
  A[Write Markdown] --> B{Looks right?}
  B -- No --> C[Edit]
  C --> A
  B -- Yes --> D[Export HTML]
  D --> E[Done]
```

Diagrams are drawn with Mermaid and redraw themselves whenever you change the theme from the appearance button in the toolbar.

## Keyboard shortcuts

| Shortcut | Action |
| --- | --- |
| Ctrl / Cmd + O | Open a file |
| Ctrl / Cmd + S | Export HTML |
| Ctrl / Cmd + \\ | Toggle the outline |
| Ctrl / Cmd + Shift + L | Switch light / dark |

## Export

Export writes a single HTML file with your rendered content, the theme colours currently in use, and any diagrams already drawn. There is no build step and nothing to install.
